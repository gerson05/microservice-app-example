name: Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feat/pipeLines ]
  pull_request:
    branches: [ main, develop, feat/pipeLines ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ACR_REGISTRY: microservicesacr.azurecr.io
  RESOURCE_GROUP: microservices-rg
  CONTAINER_APP_ENV: microservices-env

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, todos-api, users-api, auth-api, log-message-processor]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Detect changed services
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          frontend:
            - 'frontend/**'
          todos_api:
            - 'todos-api/**'
          users_api:
            - 'users-api/**'
          auth_api:
            - 'auth-api/**'
          log_message_processor:
            - 'log-message-processor/**'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ACR_REGISTRY }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Set up JDK 8 for users-api
      if: matrix.service == 'users-api'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: 'maven'

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      if: |
        (matrix.service == 'frontend' && steps.filter.outputs.frontend == 'true') ||
        (matrix.service == 'todos-api' && steps.filter.outputs.todos_api == 'true') ||
        (matrix.service == 'users-api' && steps.filter.outputs.users_api == 'true') ||
        (matrix.service == 'auth-api' && steps.filter.outputs.auth_api == 'true') ||
        (matrix.service == 'log-message-processor' && steps.filter.outputs.log_message_processor == 'true')
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run tests
      if: |
        (matrix.service == 'frontend' && steps.filter.outputs.frontend == 'true') ||
        (matrix.service == 'todos-api' && steps.filter.outputs.todos_api == 'true') ||
        (matrix.service == 'users-api' && steps.filter.outputs.users_api == 'true') ||
        (matrix.service == 'auth-api' && steps.filter.outputs.auth_api == 'true') ||
        (matrix.service == 'log-message-processor' && steps.filter.outputs.log_message_processor == 'true')
      run: |
        echo "Running tests for ${{ matrix.service }}"
        # Add specific test commands for each service
        case "${{ matrix.service }}" in
          "frontend")
            cd frontend && npm test
            ;;
          "todos-api")
            cd todos-api && npm test
            ;;
          "users-api")
            cd users-api && mvn -q -DskipITs test || true
            ;;
          "auth-api")
            cd auth-api && go test ./...
            ;;
          "log-message-processor")
            cd log-message-processor && python -m pytest
            ;;
        esac

    - name: Upload surefire reports (users-api)
      if: matrix.service == 'users-api' && steps.filter.outputs.users_api == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: users-api-surefire-reports
        path: users-api/target/surefire-reports

  # Job 2: Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 3: Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment"
        # Add deployment commands here
        docker-compose -f docker-compose.yml up -d

  # Job 4: Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      run: |
        echo "Deploying to Azure Container Apps..."
        
        # Get ACR credentials
        ACR_USERNAME=$(az acr credential show --name microservicesacr --resource-group ${{ env.RESOURCE_GROUP }} --query username --output tsv)
        ACR_PASSWORD=$(az acr credential show --name microservicesacr --resource-group ${{ env.RESOURCE_GROUP }} --query passwords[0].value --output tsv)
        
        # Deploy each container app
        echo "Deploying frontend..."
        az containerapp create \
          --name frontend-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --environment ${{ env.CONTAINER_APP_ENV }} \
          --image ${{ env.ACR_REGISTRY }}/frontend:latest \
          --target-port 8080 \
          --ingress external \
          --cpu 0.5 \
          --memory 1Gi \
          --min-replicas 1 \
          --max-replicas 3 \
          --registry-server ${{ env.ACR_REGISTRY }} \
          --registry-username $ACR_USERNAME \
          --registry-password $ACR_PASSWORD \
          --env-vars NODE_ENV=production AUTH_API_ADDRESS="https://auth-api-app.internal" TODOS_API_ADDRESS="https://todos-api-app.internal" ZIPKIN_URL="https://zipkin-app.internal/api/v2/spans" || \
        az containerapp update \
          --name frontend-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.ACR_REGISTRY }}/frontend:latest
        
        echo "Deploying auth-api..."
        az containerapp create \
          --name auth-api-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --environment ${{ env.CONTAINER_APP_ENV }} \
          --image ${{ env.ACR_REGISTRY }}/auth-api:latest \
          --target-port 8081 \
          --ingress internal \
          --cpu 0.25 \
          --memory 512Mi \
          --min-replicas 1 \
          --max-replicas 3 \
          --registry-server ${{ env.ACR_REGISTRY }} \
          --registry-username $ACR_USERNAME \
          --registry-password $ACR_PASSWORD \
          --env-vars AUTH_API_PORT=8081 JWT_SECRET="myfancysecret" USERS_API_ADDRESS="https://users-api-app.internal" ZIPKIN_URL="https://zipkin-app.internal/api/v2/spans" || \
        az containerapp update \
          --name auth-api-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.ACR_REGISTRY }}/auth-api:latest
        
        echo "Deploying todos-api..."
        az containerapp create \
          --name todos-api-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --environment ${{ env.CONTAINER_APP_ENV }} \
          --image ${{ env.ACR_REGISTRY }}/todos-api:latest \
          --target-port 8082 \
          --ingress internal \
          --cpu 0.25 \
          --memory 512Mi \
          --min-replicas 1 \
          --max-replicas 5 \
          --registry-server ${{ env.ACR_REGISTRY }} \
          --registry-username $ACR_USERNAME \
          --registry-password $ACR_PASSWORD \
          --env-vars TODO_API_PORT=8082 JWT_SECRET="myfancysecret" REDIS_HOST="microservices-redis.redis.cache.windows.net" REDIS_PORT=6380 REDIS_CHANNEL=log_channel ZIPKIN_URL="https://zipkin-app.internal/api/v2/spans" || \
        az containerapp update \
          --name todos-api-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.ACR_REGISTRY }}/todos-api:latest
        
        echo "Deploying users-api..."
        az containerapp create \
          --name users-api-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --environment ${{ env.CONTAINER_APP_ENV }} \
          --image ${{ env.ACR_REGISTRY }}/users-api:latest \
          --target-port 8083 \
          --ingress internal \
          --cpu 0.5 \
          --memory 1Gi \
          --min-replicas 1 \
          --max-replicas 3 \
          --registry-server ${{ env.ACR_REGISTRY }} \
          --registry-username $ACR_USERNAME \
          --registry-password $ACR_PASSWORD \
          --env-vars SERVER_PORT=8083 JWT_SECRET="myfancysecret" SPRING_ZIPKIN_BASEURL="https://zipkin-app.internal/" SPRING_PROFILES_ACTIVE=production SPRING_REDIS_HOST="microservices-redis.redis.cache.windows.net" SPRING_REDIS_PORT=6380 || \
        az containerapp update \
          --name users-api-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.ACR_REGISTRY }}/users-api:latest
        
        echo "Deploying log-processor..."
        az containerapp create \
          --name log-processor-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --environment ${{ env.CONTAINER_APP_ENV }} \
          --image ${{ env.ACR_REGISTRY }}/log-message-processor:latest \
          --ingress internal \
          --cpu 0.1 \
          --memory 256Mi \
          --min-replicas 1 \
          --max-replicas 2 \
          --registry-server ${{ env.ACR_REGISTRY }} \
          --registry-username $ACR_USERNAME \
          --registry-password $ACR_PASSWORD \
          --env-vars REDIS_HOST="microservices-redis.redis.cache.windows.net" REDIS_PORT=6380 REDIS_CHANNEL=log_channel ZIPKIN_URL="https://zipkin-app.internal/api/v2/spans" || \
        az containerapp update \
          --name log-processor-app \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.ACR_REGISTRY }}/log-message-processor:latest
        
        echo "✅ Deployment completed successfully!"

  # Job 5: Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Integration Tests
      run: |
        echo "Running integration tests"
        # Add integration test commands here
        docker-compose -f docker-compose.yml up -d
        sleep 30
        # Run tests against running services
        curl -f http://localhost:8082/version || exit 1
        curl -f http://localhost:9411 || exit 1
