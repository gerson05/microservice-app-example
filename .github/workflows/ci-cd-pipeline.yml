name: Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feat/pipeLines ]
  pull_request:
    branches: [ main, develop, feat/pipeLines ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, todos-api, users-api, auth-api, log-message-processor]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Detect changed services
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          frontend:
            - 'frontend/**'
          todos_api:
            - 'todos-api/**'
          users_api:
            - 'users-api/**'
          auth_api:
            - 'auth-api/**'
          log_message_processor:
            - 'log-message-processor/**'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Set up JDK 8 for users-api
      if: matrix.service == 'users-api'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: 'maven'

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      if: |
        (matrix.service == 'frontend' && steps.filter.outputs.frontend == 'true') ||
        (matrix.service == 'todos-api' && steps.filter.outputs.todos_api == 'true') ||
        (matrix.service == 'users-api' && steps.filter.outputs.users_api == 'true') ||
        (matrix.service == 'auth-api' && steps.filter.outputs.auth_api == 'true') ||
        (matrix.service == 'log-message-processor' && steps.filter.outputs.log_message_processor == 'true')
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run tests
      if: |
        (matrix.service == 'frontend' && steps.filter.outputs.frontend == 'true') ||
        (matrix.service == 'todos-api' && steps.filter.outputs.todos_api == 'true') ||
        (matrix.service == 'users-api' && steps.filter.outputs.users_api == 'true') ||
        (matrix.service == 'auth-api' && steps.filter.outputs.auth_api == 'true') ||
        (matrix.service == 'log-message-processor' && steps.filter.outputs.log_message_processor == 'true')
      run: |
        echo "Running tests for ${{ matrix.service }}"
        # Add specific test commands for each service
        case "${{ matrix.service }}" in
          "frontend")
            cd frontend && npm test
            ;;
          "todos-api")
            cd todos-api && npm test
            ;;
          "users-api")
            cd users-api && mvn test
            ;;
          "auth-api")
            cd auth-api && go test ./...
            ;;
          "log-message-processor")
            cd log-message-processor && python -m pytest
            ;;
        esac

  # Job 2: Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 3: Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment"
        # Add deployment commands here
        docker-compose -f docker-compose.yml up -d

  # Job 4: Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production
      run: |
        echo "Deploying to production environment"
        # Add production deployment commands here
        docker-compose -f docker-compose.yml up -d

  # Job 5: Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Integration Tests
      run: |
        echo "Running integration tests"
        # Add integration test commands here
        docker-compose -f docker-compose.yml up -d
        sleep 30
        # Run tests against running services
        curl -f http://localhost:8082/version || exit 1
        curl -f http://localhost:9411 || exit 1
