name: Monitoring and Alerting Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  # Job 1: Health Checks
  health-checks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start services
      run: |
        # Install docker-compose if not available
        if ! command -v docker-compose &> /dev/null; then
          echo "Installing docker-compose..."
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        fi
        
        # Try docker-compose first, fallback to docker compose
        if command -v docker-compose &> /dev/null; then
          echo "Using docker-compose command"
          docker-compose -f docker-compose-simple.yml up -d
        else
          echo "Using docker compose command"
          docker compose -f docker-compose-simple.yml up -d
        fi
        sleep 30

    - name: Health Check - TODOs API
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/version)
        if [ $response -ne 401 ]; then
          echo "TODOs API health check failed: $response"
          exit 1
        fi
        echo "TODOs API is healthy"

    - name: Health Check - Zipkin
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9411)
        if [ $response -ne 200 ]; then
          echo "Zipkin health check failed: $response"
          exit 1
        fi
        echo "Zipkin is healthy"

    - name: Health Check - Redis
      run: |
        docker exec microservice-app-example-redis-1 redis-cli ping
        if [ $? -ne 0 ]; then
          echo "Redis health check failed"
          exit 1
        fi
        echo "Redis is healthy"

  # Job 2: Performance Tests
  performance-tests:
    runs-on: ubuntu-latest
    needs: health-checks
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install k6
      run: |
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Run Performance Tests
      run: |
        cat > performance-test.js << 'EOF'
        import http from 'k6/http';
        import { check } from 'k6';

        export let options = {
          stages: [
            { duration: '30s', target: 10 },
            { duration: '1m', target: 20 },
            { duration: '30s', target: 0 },
          ],
        };

        export default function() {
          let response = http.get('http://localhost:8082/version');
          check(response, {
            'status is 401': (r) => r.status === 401,
            'response time < 500ms': (r) => r.timings.duration < 500,
          });
        }
        EOF
        
        k6 run performance-test.js

  # Job 3: Generate Monitoring Report
  monitoring-report:
    runs-on: ubuntu-latest
    needs: [health-checks, performance-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate Monitoring Report
      run: |
        echo "# Monitoring Report - $(date)" > monitoring-report.md
        echo "" >> monitoring-report.md
        echo "## Health Status" >> monitoring-report.md
        echo "- TODOs API: ✅ Healthy" >> monitoring-report.md
        echo "- Zipkin: ✅ Healthy" >> monitoring-report.md
        echo "- Redis: ✅ Healthy" >> monitoring-report.md
        echo "" >> monitoring-report.md
        echo "## Performance Metrics" >> monitoring-report.md
        echo "- Response Time: < 500ms" >> monitoring-report.md
        echo "- Throughput: 20 requests/second" >> monitoring-report.md
        echo "" >> monitoring-report.md
        echo "## Recommendations" >> monitoring-report.md
        echo "- Consider implementing circuit breaker pattern" >> monitoring-report.md
        echo "- Add caching layer for better performance" >> monitoring-report.md

    - name: Upload Monitoring Report
      uses: actions/upload-artifact@v4
      with:
        name: monitoring-report
        path: monitoring-report.md
