apiVersion: apps/v1
kind: Deployment
metadata:
  name: todos-api
  namespace: microservices
  labels:
    app: todos-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todos-api
  template:
    metadata:
      labels:
        app: todos-api
    spec:
      containers:
      - name: todos-api
        image: microservicesacr.azurecr.io/todos-api:latest
        ports:
        - containerPort: 8082
        env:
        - name: TODO_API_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: TODOS_API_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: jwt-secret
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PORT
        - name: REDIS_CHANNEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CHANNEL
        - name: ZIPKIN_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ZIPKIN_URL
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /version
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /version
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
