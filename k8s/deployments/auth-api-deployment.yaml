apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: microservices
  labels:
    app: auth-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
      - name: auth-api
        image: microservicesacr.azurecr.io/auth-api:latest
        ports:
        - containerPort: 8081
        env:
        - name: AUTH_API_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: AUTH_API_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: jwt-secret
        - name: USERS_API_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: USERS_API_ADDRESS
        - name: ZIPKIN_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ZIPKIN_URL
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
