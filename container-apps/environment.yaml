apiVersion: apps/v1
kind: ContainerAppEnvironment
metadata:
  name: microservices-env
  namespace: microservices
spec:
  location: "East US"
  resourceGroup: "microservices-rg"
  logAnalyticsConfiguration:
    customerId: "your-log-analytics-workspace-id"
    sharedKey: "your-log-analytics-shared-key"
  appSubnetResourceId: "/subscriptions/{subscription-id}/resourceGroups/microservices-rg/providers/Microsoft.Network/virtualNetworks/microservices-vnet/subnets/app-subnet"
  infrastructureSubnetResourceId: "/subscriptions/{subscription-id}/resourceGroups/microservices-rg/providers/Microsoft.Network/virtualNetworks/microservices-vnet/subnets/infrastructure-subnet"
  daprConfiguration:
    version: "1.10"
    enableApiLogging: true
