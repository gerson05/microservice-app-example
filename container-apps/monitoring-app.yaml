apiVersion: apps/v1
kind: ContainerApp
metadata:
  name: monitoring-app
  namespace: microservices
spec:
  environmentId: /subscriptions/{subscription-id}/resourceGroups/microservices-rg/providers/Microsoft.App/managedEnvironments/microservices-env
  configuration:
    ingress:
      external: true
      targetPort: 3000
      transport: http
      allowInsecure: false
    secrets:
      - name: grafana-password
        value: "admin123"
    registries:
      - server: microservicesacr.azurecr.io
        username: microservicesacr
        passwordSecretRef: acr-password
  template:
    containers:
      - name: grafana
        image: grafana/grafana:latest
        resources:
          cpu: 0.25
          memory: 512Mi
        env:
          - name: GF_SECURITY_ADMIN_PASSWORD
            secretRef: grafana-password
      - name: prometheus
        image: prom/prometheus:latest
        resources:
          cpu: 0.25
          memory: 512Mi
        env:
          - name: PROMETHEUS_CONFIG
            value: |
              global:
                scrape_interval: 15s
              scrape_configs:
                - job_name: 'frontend'
                  static_configs:
                    - targets: ['frontend-app.internal']
                - job_name: 'auth-api'
                  static_configs:
                    - targets: ['auth-api-app.internal']
                - job_name: 'todos-api'
                  static_configs:
                    - targets: ['todos-api-app.internal']
                - job_name: 'users-api'
                  static_configs:
                    - targets: ['users-api-app.internal']
    scale:
      minReplicas: 1
      maxReplicas: 1
