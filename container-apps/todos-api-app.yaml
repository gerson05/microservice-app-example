apiVersion: apps/v1
kind: ContainerApp
metadata:
  name: todos-api-app
  namespace: microservices
spec:
  environmentId: /subscriptions/{subscription-id}/resourceGroups/microservices-rg/providers/Microsoft.App/managedEnvironments/microservices-env
  configuration:
    ingress:
      external: false
      targetPort: 8082
      transport: http
    secrets:
      - name: jwt-secret
        value: "myfancysecret"
      - name: redis-connection-string
        value: "redis://:password@microservices-redis.redis.cache.windows.net:6380"
    registries:
      - server: microservicesacr.azurecr.io
        username: microservicesacr
        passwordSecretRef: acr-password
  template:
    containers:
      - name: todos-api
        image: microservicesacr.azurecr.io/todos-api:latest
        resources:
          cpu: 0.25
          memory: 512Mi
        env:
          - name: TODO_API_PORT
            value: "8082"
          - name: JWT_SECRET
            secretRef: jwt-secret
          - name: REDIS_HOST
            value: "microservices-redis.redis.cache.windows.net"
          - name: REDIS_PORT
            value: "6380"
          - name: REDIS_CHANNEL
            value: "log_channel"
          - name: ZIPKIN_URL
            value: "https://zipkin-app.internal/api/v2/spans"
    scale:
      minReplicas: 1
      maxReplicas: 5
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "10"
