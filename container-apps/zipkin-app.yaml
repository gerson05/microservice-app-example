apiVersion: apps/v1
kind: ContainerApp
metadata:
  name: zipkin-app
  namespace: microservices
spec:
  environmentId: /subscriptions/{subscription-id}/resourceGroups/microservices-rg/providers/Microsoft.App/managedEnvironments/microservices-env
  configuration:
    ingress:
      external: false
      targetPort: 9411
      transport: http
    registries:
      - server: microservicesacr.azurecr.io
        username: microservicesacr
        passwordSecretRef: acr-password
  template:
    containers:
      - name: zipkin
        image: openzipkin/zipkin:latest
        resources:
          cpu: 0.25
          memory: 512Mi
        env:
          - name: STORAGE_TYPE
            value: "elasticsearch"
          - name: ES_HOSTS
            value: "https://elasticsearch-app.internal:9200"
    scale:
      minReplicas: 1
      maxReplicas: 1
