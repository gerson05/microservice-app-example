apiVersion: apps/v1
kind: ContainerApp
metadata:
  name: frontend-app
  namespace: microservices
spec:
  environmentId: /subscriptions/{subscription-id}/resourceGroups/microservices-rg/providers/Microsoft.App/managedEnvironments/microservices-env
  configuration:
    ingress:
      external: true
      targetPort: 8080
      transport: http
      allowInsecure: false
    secrets:
      - name: jwt-secret
        value: "myfancysecret"
    registries:
      - server: microservicesacr.azurecr.io
        username: microservicesacr
        passwordSecretRef: acr-password
  template:
    containers:
      - name: frontend
        image: microservicesacr.azurecr.io/frontend:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: NODE_ENV
            value: "production"
          - name: AUTH_API_ADDRESS
            value: "https://auth-api-app.internal"
          - name: TODOS_API_ADDRESS
            value: "https://todos-api-app.internal"
          - name: ZIPKIN_URL
            value: "https://zipkin-app.internal/api/v2/spans"
    scale:
      minReplicas: 1
      maxReplicas: 3
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "10"
