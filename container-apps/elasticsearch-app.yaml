apiVersion: apps/v1
kind: ContainerApp
metadata:
  name: elasticsearch-app
  namespace: microservices
spec:
  environmentId: /subscriptions/{subscription-id}/resourceGroups/microservices-rg/providers/Microsoft.App/managedEnvironments/microservices-env
  configuration:
    ingress:
      external: false
      targetPort: 9200
      transport: http
    registries:
      - server: microservicesacr.azurecr.io
        username: microservicesacr
        passwordSecretRef: acr-password
  template:
    containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
        resources:
          cpu: 1.0
          memory: 2Gi
        env:
          - name: discovery.type
            value: "single-node"
          - name: ES_JAVA_OPTS
            value: "-Xms1g -Xmx1g"
    scale:
      minReplicas: 1
      maxReplicas: 1
